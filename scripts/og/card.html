<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('/fonts/geist-sans/Geist-Variable.woff2') format('woff2');
        font-weight: 100 900;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #ffffff;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #ffffff;
        font-family: 'Geist', sans-serif;
        color: #111014;
        -webkit-font-smoothing: antialiased;
      }

      .backdrop {
        position: absolute;
        inset: 0;
        background: url('/base.png') 0 0 / 1200px 630px no-repeat;
        filter: grayscale(1);
        opacity: 0.6;
      }

      .logo {
        position: absolute;
        top: 60px;
        left: 64px;
        width: 160px;
        height: 32px;
        background: #111014;
        -webkit-mask: url('/logo.svg') left center / contain no-repeat;
        mask: url('/logo.svg') left center / contain no-repeat;
      }

      .copy {
        position: absolute;
        left: 64px;
        bottom: 64px;
      }

      .title {
        margin: 0;
        font-size: 64px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.045em;
        white-space: nowrap;
      }

      .sub {
        margin: 20px 0 0;
        font-size: 22px;
        line-height: 1.4;
        letter-spacing: -0.012em;
        color: rgba(17, 16, 20, 0.55);
        white-space: nowrap;
      }

      .sub:empty {
        display: none;
      }

      .hero {
        position: absolute;
        padding: 6px;
        border-radius: 22px;
        background: #f2f2f4;
        box-shadow:
          inset 0 1px 0 #ffffff,
          0 2px 4px rgba(17, 16, 20, 0.06),
          0 44px 80px -24px rgba(17, 16, 20, 0.34);
      }

      .well {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 16px;
        background: #ffffff;
      }

      .well canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .frame {
        position: absolute;
        inset: -7px;
        border: 1.5px solid #a855f7;
        border-radius: 27px;
      }

      .handle {
        position: absolute;
        width: 11px;
        height: 11px;
        margin: -5.5px 0 0 -5.5px;
        background: #ffffff;
        border: 1.5px solid #a855f7;
        border-radius: 3px;
      }

      .no-preview .hero {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="backdrop"></div>
      <div class="logo"></div>
      <div class="hero">
        <div class="well"><canvas></canvas></div>
        <span class="frame"></span>
        <span class="handle" style="left: -7px; top: -7px"></span>
        <span class="handle" style="left: calc(100% + 7px); top: -7px"></span>
        <span class="handle" style="left: -7px; top: calc(100% + 7px)"></span>
        <span class="handle" style="left: calc(100% + 7px); top: calc(100% + 7px)"></span>
      </div>
      <div class="copy">
        <h1 class="title"></h1>
        <p class="sub"></p>
      </div>
    </div>
    <script>
      const WIDTH = 1200;
      const HEIGHT = 630;
      const MARGIN = 64;
      const HERO_WIDTH = 560;
      const HERO_TILT = 3;
      const FRAME_OUTSET = 7;
      const COPY_GAP = 36;
      const CONTENT_FILL = 0.68;
      const DENSE_SHARE = 0.5;
      const FEATHER = 0.04;
      const LIVE_MIN_SHARE = 0.12;
      const params = new URLSearchParams(location.search);
      const title = document.querySelector('.title');
      const sub = document.querySelector('.sub');
      const copy = document.querySelector('.copy');
      const hero = document.querySelector('.hero');
      const well = hero.querySelector('.well');
      const canvas = well.querySelector('canvas');

      const placeHero = () => {
        const width = HERO_WIDTH;
        const height = Math.round(width / 1.6);
        const angle = (HERO_TILT * Math.PI) / 180;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const reach = (width / 2 + FRAME_OUTSET) * cos + (height / 2 + FRAME_OUTSET) * sin;
        const centerX = WIDTH - MARGIN - reach;
        const centerY = HEIGHT / 2;
        Object.assign(hero.style, {
          left: `${centerX - width / 2}px`,
          top: `${centerY - height / 2}px`,
          width: `${width}px`,
          height: `${height}px`,
          transform: `rotate(${-HERO_TILT}deg)`
        });
        const lowerLeft = centerX - ((width / 2 + FRAME_OUTSET) * cos - (height / 2 + FRAME_OUTSET) * sin);
        return Math.floor(lowerLeft - MARGIN - COPY_GAP);
      };

      const whenLoaded = video =>
        new Promise((resolve, reject) => {
          video.addEventListener('loadeddata', resolve, { once: true });
          video.addEventListener('error', () => reject(new Error(`Could not load ${video.src}`)), { once: true });
        });

      const nextFrame = () => new Promise(resolve => requestAnimationFrame(() => resolve()));

      const seek = (video, time) =>
        new Promise(resolve => {
          video.addEventListener('seeked', () => nextFrame().then(resolve), { once: true });
          video.currentTime = time;
        });

      const lightness = (data, index) => 0.2126 * data[index] + 0.7152 * data[index + 1] + 0.0722 * data[index + 2];

      const readLightness = (context, width, height) => {
        const { data } = context.getImageData(0, 0, width, height);
        const values = new Float32Array(width * height);
        for (let i = 0; i < values.length; i += 1) values[i] = lightness(data, i * 4);
        return values;
      };

      const ringIndexes = (width, height) => {
        const indexes = [];
        for (let x = 0; x < width; x += 1) indexes.push(x, (height - 1) * width + x);
        for (let y = 0; y < height; y += 1) indexes.push(y * width, y * width + width - 1);
        return indexes;
      };

      const ringOf = (values, width, height) =>
        ringIndexes(width, height)
          .map(index => values[index])
          .sort((a, b) => a - b);

      const backgroundOf = (values, width, height) => {
        const ring = ringOf(values, width, height);
        return ring[ring.length >> 1];
      };

      const backgroundColorOf = (context, width, height) => {
        const { data } = context.getImageData(0, 0, width, height);
        const channels = [[], [], []];
        ringIndexes(width, height).forEach(index => {
          for (let c = 0; c < 3; c += 1) channels[c].push(data[index * 4 + c]);
        });
        const [r, g, b] = channels.map(values => values.sort((a, b) => a - b)[values.length >> 1]);
        return `rgb(${r}, ${g}, ${b})`;
      };

      const edgeCoverage = (values, width, height, tolerance = 10) => {
        const ring = ringOf(values, width, height);
        const median = ring[ring.length >> 1];
        return ring.filter(value => Math.abs(value - median) > tolerance).length / ring.length;
      };

      const hasFlatBackground = (values, width, height, tolerance) =>
        edgeCoverage(values, width, height, tolerance) < 0.15;

      const touchesEdge = (values, width, height) => {
        const background = backgroundOf(values, width, height);
        const differs = index => Math.abs(values[index] - background) > 24;
        for (let x = 0; x < width; x += 1) {
          if (
            differs(x) ||
            differs(width + x) ||
            differs((height - 1) * width + x) ||
            differs((height - 2) * width + x)
          ) {
            return true;
          }
        }
        for (let y = 0; y < height; y += 1) {
          if (
            differs(y * width) ||
            differs(y * width + 1) ||
            differs(y * width + width - 1) ||
            differs(y * width + width - 2)
          ) {
            return true;
          }
        }
        return false;
      };

      const contentScore = (values, width, height) => {
        const background = backgroundOf(values, width, height);
        let content = 0;
        let edges = 0;
        for (let y = 0; y < height; y += 1) {
          let previous = values[y * width];
          for (let x = 0; x < width; x += 1) {
            const value = values[y * width + x];
            content += Math.max(0, Math.abs(value - background) - 8);
            edges += Math.abs(value - previous);
            previous = value;
          }
        }
        return (content + edges * 0.5) / (width * height);
      };

      const motionBetween = (a, b) => {
        let total = 0;
        for (let i = 0; i < a.length; i += 1) total += Math.abs(a[i] - b[i]);
        return total / a.length;
      };

      const strongestContrast = (values, background) => {
        const sample = [];
        for (let i = 0; i < values.length; i += 7) sample.push(Math.abs(values[i] - background));
        sample.sort((a, b) => a - b);
        return sample[Math.floor(sample.length * 0.9995)];
      };

      const contentBox = (values, width, height, threshold) => {
        const background = backgroundOf(values, width, height);
        const columns = new Float64Array(width);
        const rows = new Float64Array(height);
        let total = 0;
        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            if (Math.abs(values[y * width + x] - background) > threshold) {
              columns[x] += 1;
              rows[y] += 1;
              total += 1;
            }
          }
        }
        if (total < 40) return { x: 0, y: 0, width, height };
        const span = counts => {
          let sum = 0;
          let start = 0;
          let end = counts.length - 1;
          for (let i = 0; i < counts.length; i += 1) {
            sum += counts[i];
            if (sum >= total * 0.02) {
              start = i;
              break;
            }
          }
          sum = 0;
          for (let i = counts.length - 1; i >= 0; i -= 1) {
            sum += counts[i];
            if (sum >= total * 0.02) {
              end = i;
              break;
            }
          }
          return [start, Math.max(start + 1, end)];
        };
        const [x0, x1] = span(columns);
        const [y0, y1] = span(rows);
        return { x: x0, y: y0, width: x1 - x0, height: y1 - y0 };
      };

      const chooseFrame = async video => {
        const probe = document.createElement('canvas');
        probe.width = 160;
        probe.height = Math.round((160 * video.videoHeight) / video.videoWidth);
        const context = probe.getContext('2d', { willReadFrequently: true });
        const sample = async time => {
          await seek(video, time);
          context.drawImage(video, 0, 0, probe.width, probe.height);
          return readLightness(context, probe.width, probe.height);
        };

        const duration = video.duration;
        const step = Math.min(0.12, duration / 40);
        let best = { score: -Infinity, time: 0 };
        const samples = 16;
        for (let i = 0; i < samples; i += 1) {
          const time = duration * (0.15 + (0.75 * i) / (samples - 1));
          const current = await sample(time);
          const after = await sample(Math.min(duration - 0.01, time + step));
          const flat = hasFlatBackground(current, probe.width, probe.height);
          const clipped = flat && touchesEdge(current, probe.width, probe.height);
          const score =
            (contentScore(current, probe.width, probe.height) * (clipped ? 0.45 : 1)) /
            (1 + motionBetween(current, after) / 6);
          if (score > best.score) best = { score, time };
        }
        return best;
      };

      const coverage = (values, width, height) => {
        const background = backgroundOf(values, width, height);
        let count = 0;
        for (let i = 0; i < values.length; i += 1) if (Math.abs(values[i] - background) > 24) count += 1;
        return count / values.length;
      };

      const probeOf = (source, sourceWidth, sourceHeight) => {
        const probe = document.createElement('canvas');
        probe.width = 160;
        probe.height = Math.round((160 * sourceHeight) / sourceWidth);
        const context = probe.getContext('2d', { willReadFrequently: true });
        context.drawImage(source, 0, 0, probe.width, probe.height);
        return coverage(readLightness(context, probe.width, probe.height), probe.width, probe.height);
      };

      const fadeStops = (gradient, band) => {
        const steps = 8;
        for (let i = 0; i <= steps; i += 1) {
          const t = i / steps;
          const alpha = t * t * t * (t * (t * 6 - 15) + 10);
          gradient.addColorStop(band * t, `rgba(0, 0, 0, ${alpha.toFixed(4)})`);
          gradient.addColorStop(1 - band * t, `rgba(0, 0, 0, ${alpha.toFixed(4)})`);
        }
        return gradient;
      };

      const feather = source => {
        const soft = document.createElement('canvas');
        soft.width = source.width;
        soft.height = source.height;
        const context = soft.getContext('2d');
        context.drawImage(source, 0, 0);
        context.globalCompositeOperation = 'destination-in';
        const band = FEATHER;
        context.fillStyle = fadeStops(context.createLinearGradient(0, 0, soft.width, 0), band);
        context.fillRect(0, 0, soft.width, soft.height);
        context.fillStyle = fadeStops(context.createLinearGradient(0, 0, 0, soft.height), band);
        context.fillRect(0, 0, soft.width, soft.height);
        return soft;
      };

      const drawSource = (source, sourceWidth, sourceHeight) => {
        const full = document.createElement('canvas');
        full.width = sourceWidth;
        full.height = sourceHeight;
        const fullContext = full.getContext('2d', { willReadFrequently: true });
        fullContext.drawImage(source, 0, 0);
        const values = readLightness(fullContext, sourceWidth, sourceHeight);
        const background = backgroundOf(values, sourceWidth, sourceHeight);
        const fill = backgroundColorOf(fullContext, sourceWidth, sourceHeight);
        const contrast = strongestContrast(values, background);
        const box = contentBox(values, sourceWidth, sourceHeight, Math.max(6, 0.12 * contrast));
        const solid = contentBox(values, sourceWidth, sourceHeight, Math.max(24, 0.3 * contrast));
        const edge = Math.max(3, Math.round(Math.min(sourceWidth, sourceHeight) * 0.015));
        const touches =
          solid.x <= edge ||
          solid.y <= edge ||
          solid.x + solid.width >= sourceWidth - edge ||
          solid.y + solid.height >= sourceHeight - edge;
        const dense = (box.width * box.height) / (sourceWidth * sourceHeight) > DENSE_SHARE;
        const forceCover = params.get('fit') === 'cover';
        const flat = !forceCover && hasFlatBackground(values, sourceWidth, sourceHeight, 24) && !touches && !dense;

        const ratio = window.devicePixelRatio || 1;
        const width = Math.round(well.clientWidth * ratio);
        const height = Math.round(well.clientHeight * ratio);
        canvas.width = width;
        canvas.height = height;

        const cover = Math.max(width / sourceWidth, height / sourceHeight);
        const fit = Math.min((width * CONTENT_FILL) / box.width, (height * CONTENT_FILL) / box.height);
        const scale = forceCover
          ? cover
          : flat
            ? Math.min(fit, cover * 2.5)
            : Math.min(Math.max(fit, cover), cover * 2);
        const centerX = box.x + box.width / 2;
        const centerY = box.y + box.height / 2;
        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
        const idealX = width / 2 - centerX * scale;
        const idealY = height / 2 - centerY * scale;
        const offsetX = flat ? idealX : clamp(idealX, Math.min(0, width - sourceWidth * scale), 0);
        const offsetY = flat ? idealY : clamp(idealY, Math.min(0, height - sourceHeight * scale), 0);

        const context = canvas.getContext('2d');
        context.fillStyle = fill;
        context.fillRect(0, 0, width, height);
        context.imageSmoothingQuality = 'high';
        context.drawImage(flat ? feather(full) : full, offsetX, offsetY, sourceWidth * scale, sourceHeight * scale);
        well.style.background = fill;
        return { zoom: Number((scale / cover).toFixed(2)), box, flat, dense, touches };
      };

      const loadVideo = async src => {
        const video = document.createElement('video');
        video.muted = true;
        video.playsInline = true;
        video.preload = 'auto';
        video.src = src;
        await whenLoaded(video);
        if (!Number.isFinite(video.duration)) await seek(video, 1e6);
        return video;
      };

      const loadStill = src =>
        new Promise((resolve, reject) => {
          const still = new Image();
          still.onload = () => resolve(still);
          still.onerror = () => reject(new Error(`Could not load ${src}`));
          still.src = src;
        });

      const renderPreview = async ({ image, video }) => {
        const still = image ? await loadStill(image) : null;
        const clip = video ? await loadVideo(video) : null;
        const frame = clip ? await chooseFrame(clip) : null;
        if (frame) await seek(clip, frame.time);
        const liveCoverage = still ? probeOf(still, still.naturalWidth, still.naturalHeight) : 0;
        const videoCoverage = frame ? probeOf(clip, clip.videoWidth, clip.videoHeight) : 0;
        const coverages = { live: Number(liveCoverage.toFixed(4)), video: Number(videoCoverage.toFixed(4)) };
        if (still && liveCoverage > 0.002 && (!frame || liveCoverage >= LIVE_MIN_SHARE * videoCoverage)) {
          return { source: 'live', coverages, ...drawSource(still, still.naturalWidth, still.naturalHeight) };
        }
        return { source: 'video', coverages, time: frame.time, ...drawSource(clip, clip.videoWidth, clip.videoHeight) };
      };

      const fitTitle = maxWidth => {
        let size = 64;
        title.style.fontSize = `${size}px`;
        while (size > 40 && title.scrollWidth > maxWidth) {
          size -= 2;
          title.style.fontSize = `${size}px`;
        }
        return size;
      };

      const render = async () => {
        const image = params.get('image');
        const video = params.get('video');
        const hasPreview = Boolean(image || video);
        title.textContent = params.get('title') || '';
        sub.textContent = params.get('sub') || '';
        document.body.classList.toggle('no-preview', !hasPreview);
        const copyWidth = hasPreview ? placeHero() : WIDTH - MARGIN * 2;
        copy.style.width = `${copyWidth}px`;
        await document.fonts.load('500 64px "Geist"');
        await document.fonts.ready;
        const fontSize = fitTitle(copyWidth);
        const frame = hasPreview ? await renderPreview({ image, video }) : null;
        await nextFrame();
        await nextFrame();
        window.__og = { status: 'ready', token: params.get('token'), fontSize, source: frame?.source ?? 'none', frame };
      };

      render().catch(error => {
        window.__og = { status: 'error', token: params.get('token'), message: error.message };
      });
    </script>
  </body>
</html>
